name: Fetch & Deploy Schedules

on:
  schedule:
    - cron: "*/10 10-23 * 3-11 *" 
    - cron: "*/10 0-4 * 3-11 *"   
    - cron: "*/10 11-23 * 12,1,2 *" 
    - cron: "*/10 0-5 * 12,1,2 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch schedules from EventLink
        run: node fetch-eventlink-api.js || node fetch.js
        env:
          EVENTLINK_API_TOKEN: ${{ secrets.EVENTLINK_API_TOKEN }}
          EVENTLINK_CALENDAR_IDS: ${{ secrets.EVENTLINK_CALENDAR_IDS }}
          EVENTLINK_ICAL_URL: ${{ secrets.EVENTLINK_ICAL_URL }}

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update schedules"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
