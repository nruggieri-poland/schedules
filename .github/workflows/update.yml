name: Fetch & Deploy Schedules

on:
  schedule:
    - cron: "*/10 10-23 * 3-11 *" 
    - cron: "*/10 0-4 * 3-11 *"   
    - cron: "*/10 11-23 * 12,1,2 *" 
    - cron: "*/10 0-5 * 12,1,2 *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fetch schedules from EventLink
        run: node fetch-eventlink-api.js || node fetch.js
        env:
          EVENTLINK_API_TOKEN: ${{ secrets.EVENTLINK_API_TOKEN }}
          EVENTLINK_CALENDAR_IDS: ${{ secrets.EVENTLINK_CALENDAR_IDS }}
          EVENTLINK_ICAL_URL: ${{ secrets.EVENTLINK_ICAL_URL }}

      - name: Build today's-changes graphic
        run: node scripts/build-today-graphic.js

      - name: Commit updated data files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-update schedules"
            git push
          fi

      # Runs after the push above so dist/history/*.png is already live at
      # raw.githubusercontent.com by the time Buffer fetches it. No-ops
      # quietly if BUFFER_ACCESS_TOKEN isn't set, and only actually posts
      # when today's set of changes differs from the last thing it posted —
      # see scripts/post-to-buffer.js for the dedup logic.
      - name: Post schedule-change alerts to Buffer
        run: node scripts/post-to-buffer.js
        env:
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID_INSTAGRAM: ${{ secrets.BUFFER_CHANNEL_ID_INSTAGRAM }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_TWITTER: ${{ secrets.BUFFER_CHANNEL_ID_TWITTER }}
          MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/dist

      # Separate from the commit above: post-to-buffer.js writes its dedup
      # record (dist/meta/buffer-post-state.json) only after posting, so it
      # has to be committed in its own step — otherwise a fresh checkout next
      # run would never see it and would repost the same alert forever.
      - name: Commit Buffer post state
        run: |
          git add dist/meta/buffer-post-state.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Record Buffer post state"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
